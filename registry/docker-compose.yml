# Local Postgres for the registry. Testnet-only project, so these credentials
# are deliberately boring and local-only — nothing here is a secret.
services:
  postgres:
    image: postgres:17-alpine
    container_name: cleargate-registry-db
    environment:
      POSTGRES_USER: cleargate
      POSTGRES_PASSWORD: cleargate
      POSTGRES_DB: cleargate
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - registry-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleargate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  registry-data:
