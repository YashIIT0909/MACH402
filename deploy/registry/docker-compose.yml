# The registry server: Postgres, the registry, and Caddy terminating HTTPS in
# front of it. One command, from this directory:
#
#   docker compose up -d --build
#
# Configuration lives in .env beside this file (copy .env.example).
name: cleargate-registry

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cleargate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/registry/.env}
      POSTGRES_DB: cleargate
    volumes:
      - registry-data:/var/lib/postgresql/data
    # Deliberately no published port: only the registry, on this compose
    # network, can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleargate -d cleargate"]
      interval: 5s
      timeout: 5s
      retries: 20

  registry:
    build:
      context: ../..
      dockerfile: registry/Dockerfile
    image: cleargate-registry
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://cleargate:${POSTGRES_PASSWORD}@postgres:5432/cleargate
      HOST: 0.0.0.0
      PORT: "4400"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4400/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${REGISTRY_DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - registry

volumes:
  registry-data:
  caddy-data:
  caddy-config:
