# The website server: the Next.js site and Caddy terminating HTTPS in front of
# it. One command, from this directory:
#
#   docker compose up -d --build
#
# Configuration lives in .env beside this file (copy .env.example).
name: cleargate-web

services:
  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
    image: cleargate-web
    restart: unless-stopped
    environment:
      # The registry's public URL. The site's server reads listings from it, and
      # /provide puts it into every provider's install command.
      REGISTRY_URL: ${REGISTRY_URL:?set REGISTRY_URL in deploy/web/.env}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${WEB_DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  caddy-data:
  caddy-config:
