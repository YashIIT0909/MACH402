name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The live payment test needs a funded testnet account, so it runs on a
  # schedule as well: a facilitator change should surface as a failing build,
  # not as a failed demo.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  agent:
    name: agent (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go.sum
      - name: vet
        run: cd agent && go vet ./...
      - name: build
        run: cd agent && go build ./...
      # The runner tests skip themselves when there is no Docker daemon, so this
      # covers the sandbox on runners that have one and stays green where not.
      - name: test
        run: cd agent && go test ./...

  typescript:
    name: client and smoke (ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck

  facilitator:
    name: facilitator still supports hedera:testnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cleargate/smoke run supported

  smoke:
    name: live settlement on hedera testnet
    # Only on a schedule or by hand: it spends real testnet HBAR and needs the
    # funded-account secret, which forks do not have.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cleargate/smoke run smoke
        env:
          HEDERA_ACCOUNT_ID: ${{ secrets.HEDERA_ACCOUNT_ID }}
          HEDERA_PRIVATE_KEY: ${{ secrets.HEDERA_PRIVATE_KEY }}
          HEDERA_KEY_TYPE: ${{ vars.HEDERA_KEY_TYPE || 'ecdsa' }}
          PAY_TO_ACCOUNT_ID: ${{ vars.PAY_TO_ACCOUNT_ID }}
